# PostgreSQL and read-only pgweb for local macOS and remote Linux Podman hosts.
# Host ports intentionally bind to loopback. Use an SSH tunnel for remote pgweb.
services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: tefas-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEFAS_POSTGRES_DB:-tefas}
      POSTGRES_USER: ${TEFAS_POSTGRES_USER:-tefas}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${TEFAS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - tefas_pgdata:/var/lib/postgresql/data
      - ./.secrets/postgres-password:/run/secrets/postgres-password:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgweb:
    image: docker.io/sosedoff/pgweb:0.17.0
    container_name: tefas-pro-pgweb
    restart: unless-stopped
    command:
      - pgweb
      - --bind=0.0.0.0
      - --listen=8081
      - --readonly
      - --host=postgres
      - --port=5432
      - --user=${TEFAS_POSTGRES_USER:-tefas}
      - --passfile=/run/secrets/pgweb-pgpass
      - --db=${TEFAS_POSTGRES_DB:-tefas}
      - --ssl=disable
    ports:
      - "127.0.0.1:${TEFAS_PGWEB_PORT:-8081}:8081"
    volumes:
      - ./.secrets/pgpass:/run/secrets/pgweb-pgpass:ro,Z,U
    depends_on:
      - postgres

  # Geliştirme sunucusu. Yalnız yerelde kullanılır; dağıtım hâlâ
  # server/Containerfile'ın üretim aşamasıyla kurulan imajı çalıştırır.
  #
  # Kaynak host'tan bağlanır ve container içinde izlenir: pnpm serve iki tek
  # seferlik adımdan oluştuğu için kod değiştiğinde ne dist/main.js yenileniyor
  # ne de sunucu yeni kodu görüyordu.
  app:
    build:
      context: ..
      dockerfile: server/Containerfile
      target: dev
    container_name: tefas-pro-app
    restart: unless-stopped
    environment:
      # Parola adrese gömülmez; pgweb gibi korumalı bir dosyadan okunur.
      # Gömülseydi `podman compose config` çıktısında açıkta görünürdü.
      DATABASE_URL: postgresql://${TEFAS_POSTGRES_USER:-tefas}@postgres:5432/${TEFAS_POSTGRES_DB:-tefas}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      SESSION_TTL: "43200"
      SECURE_COOKIE: "false"
      # applehv sanal makinesi üzerinden gelen bind mount'larda inotify
      # olayları güvenilir iletilmiyor: dosya kaydedilir, izleyici fark etmez.
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "500"
      TSC_WATCHFILE: PriorityPollingInterval
    ports:
      - "127.0.0.1:${TEFAS_APP_PORT:-8282}:8282"
    volumes:
      # Yalnız kaynak bağlanır. node_modules bağlanmaz: host'taki paketler
      # macOS/arm64 için derlenmiş, Linux container'da çalışmazlar.
      - ../src:/app/src:Z
      - ../public:/app/public:Z
      - ../tests:/app/tests:Z
      - ../db/migrations:/app/db/migrations:Z
      - ../tsconfig.json:/app/tsconfig.json:ro,Z
      - ../tsconfig.build.json:/app/tsconfig.build.json:ro,Z
      - ./.secrets/postgres-password:/run/secrets/postgres-password:ro,Z
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tefas_pgdata:
